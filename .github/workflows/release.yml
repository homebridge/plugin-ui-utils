name: Release

# Latest: GitHub releases. Beta and alpha: pushes to beta-X.Y.Z / alpha-X.Y.Z branches.
# The release itself lives in homebridge/.github.

on:
  release:
    types: [released]
  push:
    branches:
      - beta-*.*.*
      - alpha-*.*.*
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'homebridge/plugin-ui-utils' }}
    uses: homebridge/.github/.github/workflows/npm-release.yml@latest
